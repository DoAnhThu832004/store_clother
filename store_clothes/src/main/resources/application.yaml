server:
  port: 8080
  servlet:
    context-path: /clothes

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  datasource:
    url: ${DBMS_CONNECTION:jdbc:mysql://localhost:3306/store_clothes?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}
    driverClassName: "com.mysql.cj.jdbc.Driver"
    password: ${DBMS_PASSWORD:root}
    username: ${DBMS_USERNAME:root}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      # validate: Hibernate kiểm tra schema khớp với entity, không tự sửa DB.
      # Flyway sẽ đảm nhiệm việc quản lý schema — không để Hibernate tự sửa production DB.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        # Batch insert/update để tối ưu hiệu năng khi lưu nhiều variant cùng lúc
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        # =================================================================
        # MULTI-TENANCY CONFIGURATION (Hibernate 6 DISCRIMINATOR strategy)
        # =================================================================
        # TenantIdentifierResolver tự đăng ký qua HibernatePropertiesCustomizer bean.
        # Không cần khai báo thủ công ở đây, Spring Boot sẽ tự động pick up bean.

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false

  # ============================================================
  # Flyway Migration Configuration
  # ============================================================
  flyway:
    enabled: false
    locations: classpath:db/migration
    sql-migration-prefix: V
    sql-migration-separator: __
    sql-migration-suffixes: .sql
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    # Tự động xóa bản ghi FAILED trong flyway_schema_history trước khi retry
    # Cần thiết khi V2 đã fail lần trước — không cần chạy flyway:repair thủ công
    repair-on-migrate: true
    # Cho phép migration chạy lại nếu checksum thay đổi (sau khi sửa file SQL)
    out-of-order: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.example.store_clothes: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ============================================================
# JWT Configuration
# ============================================================
jwt:
  # Secret key dùng để ký JWT — THAY BẰNG GIÁ TRỊ THỰC TRƯỚC KHI DEPLOY!
  # Phải là chuỗi Base64-encoded >= 256 bit (32 bytes).
  # Tạo bằng lệnh: openssl rand -base64 32
  # Trong production: Lấy từ biến môi trường: ${JWT_SECRET}
  secret: ${JWT_SECRET:dGhpc2lzYXZlcnlsb25nc2VjcmV0a2V5Zm9yanduYXV0aHN5c3RlbTI2Cg==}

  # Access Token hết hạn sau 15 phút (900000 ms)
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}

  # Refresh Token hết hạn sau 7 ngày (604800000 ms)
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
